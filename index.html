<style>
/* 레이아웃: 휴대폰은 그림을 위에 고정하고 아래에서 고르기, 넓은 화면은 그림 왼쪽 / 고르기 오른쪽 */
:root{--bg:#fbe9ee;--panel:#fffdfd;--ink:#3a2824;--soft:#8a6f69;--line:#e6c9cf;--accent:#c93445;--on-accent:#fff;--tint:#fdf1f3;

@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2a2026;--panel:#352930;--ink:#fbeaec;--soft:#c3a9ae;--line:#5a4650;--accent:#f0808c;--on-accent:#2a1418;--tint:#42333b;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#2a2026;--panel:#352930;--ink:#fbeaec;--soft:#c3a9ae;--line:#5a4650;--accent:#f0808c;--on-accent:#2a1418;--tint:#42333b;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:400 15px/1.55 var(--body)}
.app{max-width:1080px;margin:0 auto;padding-block:14px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:14px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font:400 26px/1.2 var(--display);margin:0}

#status{color:var(--soft);font-size:13px}

.side{display:grid;gap:14px;min-width:0;align-content:start}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 8px;scrollbar-width:thin}
button{font:inherit;color:inherit;cursor:pointer}
.tabs button,.seg button{flex:none;border:2px solid var(--line);background:var(--panel);border-radius:4px;padding:7px 12px;min-height:40px}
.tabs button[aria-selected=true],.seg button[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
.panel{background:var(--panel);border:2px solid var(--ink);border-radius:4px;padding:14px;display:grid;gap:14px;min-width:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:8px}
.grid button{border:2px solid var(--line);background:var(--tint);border-radius:4px;padding:6px 4px;display:grid;justify-items:center;align-content:end;gap:4px;font-size:12px;line-height:1.3;min-height:88px;min-width:0;word-break:keep-all}
.grid button[aria-pressed=true]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.grid img{width:48px;height:48px;object-fit:contain;image-rendering:pixelated}
.sw{width:40px;height:40px;border-radius:50%;border:2px solid var(--ink)}
.plus{font:400 32px/48px var(--display);color:var(--accent);height:48px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
label{display:grid;gap:4px;font-size:13px;color:var(--soft);flex:1 1 150px;min-width:0}
input[type=text],input[type=date]{font:inherit;font-size:16px;color:var(--ink);background:var(--tint);border:2px solid var(--line);border-radius:4px;padding:8px 10px;width:100%;min-width:0;max-width:100%;min-height:44px}
input[type=date]{-webkit-appearance:none;appearance:none;display:block;text-align:left}input::-webkit-date-and-time-value{text-align:left}
input[type=range]{width:100%;accent-color:var(--accent)}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.main{border:2px solid var(--accent);background:var(--accent);color:var(--on-accent);border-radius:4px;padding:9px 16px;font-weight:600;min-height:44px}
.plain{border:2px solid var(--line);background:none;border-radius:4px;padding:7px 12px;min-height:40px}
p{margin:0}.hint{color:var(--soft);font-size:13px}
ol{margin:0;padding-left:1.4em;display:grid;gap:8px}
pre{margin:0;background:var(--tint);border:2px solid var(--line);border-radius:4px;padding:10px;overflow:auto;max-height:180px;font-size:12px;white-space:pre;user-select:all}
.inner{display:grid;gap:14px;padding-top:12px;min-width:0}summary{cursor:pointer;min-height:40px;padding-block:8px;font-weight:600}#view{position:fixed;inset:0;z-index:30}#view canvas{width:100%;height:100%;display:block}#view button{position:absolute;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));border:2px solid #3a2824;background:#fffdfd;color:#3a2824;border-radius:4px;padding:8px 14px;min-height:44px}.zoom{border:0;background:none;padding:0;justify-self:start}#full{position:fixed;inset:0;z-index:20;background:var(--bg);display:grid;align-content:center;justify-items:center;gap:12px;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}#full img{max-width:100%;max-height:82vh;-webkit-touch-callout:default}a.main{display:inline-block;text-decoration:none}.out{max-width:min(100%,300px);-webkit-touch-callout:default;border:2px solid var(--line);border-radius:4px;display:block}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

function cutBg(c){ // 가장자리와 이어진 비슷한 색을 지운다

  const add=i=>{if(!seen[i]&&near(i)){seen[i]=1;st.push(i)}};
  for(let i=0;i<w;i++){add(i);add((h-1)*w+i)}for(let j=0;j<h;j++){add(j*w);add(j*w+w-1)}

  }else if(sel==='bubble'){
    for(const[k,l]of[['b1','엄마 말풍선'],['b2','인형 말풍선']])kids.push(field(l,el('input',{id:k,type:'text',maxLength:k==='b1'?14:7,value:S[k],oninput:e=>{S[k]=e.target.value;changed()}})));
    kids.push(el('p',{className:'hint',textContent:(PUB?'태명으로 바꿔 보세요. ':'')+'비워 두면 말풍선이 사라져요.'}));
  }else{
    const cur=S.pick[sel]==='mine'&&mine[sel]?'mine':opt(sel).id,pic=o=>o.kind==='sprite'||(o.kind==='orig'&&o.img&&ASSET[o.img])?el('img',{src:ASSET[o.img],alt:''}):o.kind==='pat'?(()=>{const c=cv(44,44);pattern(c.getContext('2d'),44,44,o.id);return el('img',{src:c.toDataURL(),alt:''})})():o.color?(()=>{const e=el('span',{className:'sw'});e.style.background=o.color;return e})():el('span',{className:'plus',textContent:o.kind==='none'?'×':'↺'});
    const g=el('div',{className:'grid'},...s.opts.map(o=>el('button',{type:'button','aria-pressed':String(cur===o.id),onclick:()=>{S.pick[sel]=o.id;delete S.adj[sel];changed();panel()}},pic(o),el('span',{textContent:o.label}))));
    if(s.mine){
      if(mine[sel])g.append(el('button',{type:'button','aria-pressed':String(cur==='mine'),onclick:()=>{S.pick[sel]='mine';changed();panel()}},el('img',{src:mine[sel],alt:''}),el('span',{textContent:'내 그림'})));
      g.append(el('button',{type:'button',onclick:()=>$('#file').click()},el('span',{className:'plus',textContent:'+'}),el('span',{textContent:mine[sel]?'다른 사진':'내 사진 넣기'})));
    }
    kids.push(g);
    if(cur==='mine'&&src[sel]&&(s.a||s.spots))kids.push(seg([['cut','배경 지우기'],['round','동그랗게'],['whole','그대로']],cut[sel],v=>{cut[sel]=v;useMine(sel)},'내 사진 모양'));
    if((s.a||s.spots)&&!(s.spots&&cur==='orig')&&!(s.id==='print'&&cur==='orig')&&cur!=='none'){
      const a=adj(sel),set=(k,v)=>{S.adj[sel]={...adj(sel),[k]:v};changed()};
      kids.push(el('div',{className:'row'},field('크기',el('input',{id:'size',type:'range',min:.3,max:2.5,step:.05,value:a.s,oninput:e=>set('s',+e.target.value)})),...(s.a?[field('기울기',el('input',{id:'rot',type:'range',min:-180,max:180,step:5,value:a.r,oninput:e=>set('r',+e.target.value)}))]:[]),el('button',{type:'button',className:'plain',textContent:'제자리로',onclick:()=>{delete S.adj[sel];changed();panel()}})));
      kids.push(el('p',{className:'hint',textContent:'그림에서 끌면 위치를 옮길 수 있어요.'}));
    }
  }
  P.replaceChildren(...kids);
}
/* 그림을 눌러 고르고 끌어 옮기기 */
let drag=null;const C=$('#c');
const pt=e=>{const r=C.getBoundingClientRect();return[SQUARE.x+(e.clientX-r.left)/r.width*SQUARE.w,SQUARE.y+(e.clientY-r.top)/r.height*SQUARE.h]};
C.onpointerdown=e=>{const[x,y]=pt(e),hit=[...boxes].reverse().filter(b=>x>=b.x&&x<=b.x+b.w&&y>=b.y&&y<=b.y+b.h);if(!hit.length)return;const h=hit.find(b=>b.id===sel)||hit[0];if(h.id!==sel)choose(h.id);const s=slot(sel);if((s.a||s.spots)&&!(['orn','print'].includes(sel)&&opt(sel).kind==='orig')){drag=[x,y,adj(sel)];C.setPointerCapture(e.pointerId)}};
C.onpointermove=e=>{if(!drag)return;const[x,y]=pt(e);S.adj[sel]={...drag[2],x:drag[2].x+x-drag[0],y:drag[2].y+y-drag[1]};render()};
C.onpointerup=C.onpointercancel=()=>{if(drag){drag=null;changed()}};

/* ---------- 휴대폰에 넣기 ---------- */
let outShown=null;
async function save(){
  const c=cv(1200,1200*TALL.h/TALL.w),name='baby-wallpaper.png';draw(c,TALL);
  render();outShown=c.toDataURL('image/png');phone();$('.zoom').previousSibling.scrollIntoView({block:'start'});
  const blob=new Blob([Uint8Array.from(atob(outShown.split(',')[1]),x=>x.charCodeAt(0))],{type:'image/png'});
  if(!window.claude){ // 휴대폰에서는 공유 창(이미지 저장)을 먼저 쓴다
    const file=new File([blob],name,{type:'image/png'});
    if(matchMedia('(pointer:coarse)').matches&&navigator.canShare?.({files:[file]}))try{await navigator.share({files:[file]});return}catch(e){if(e.name==='AbortError')return}
    el('a',{href:outShown,download:name}).click();return}
  try{const d=await claude.use('downloads');if(d){await d.save({filename:name,data:blob});note('그림을 저장했어요')}}catch{}
}
function phone(){
  const li=(...k)=>el('li',{},...k),ios=os==='ios';
  const show=el('div',{},el('button',{type:'button',className:'main',textContent:'완성! 크게 보기',onclick:()=>{S.done=1;store('design',S);view()}}));
  const kids=[];
  if(alone)kids.push(el('h2',{textContent:'다 꾸몄나요?'}),el('p',{textContent:'다음부터는 아이콘을 누르면 꾸민 방과 오늘의 D-day, 시계가 바로 나와요.'}),show);
  else{
    kids.push(el('h2',{textContent:'휴대폰에 넣기'}),el('p',{textContent:'설치도 로그인도 필요 없어요.'}));
    if(/KAKAOTALK/i.test(navigator.userAgent)&&!window.claude)kids.push(el('div',{},el('a',{className:'main',href:'kakaotalk://web/openExternal?url='+encodeURIComponent(location.href),textContent:'먼저 사파리·크롬으로 열기'})));
    kids.push(seg([['ios','아이폰'],['and','갤럭시·안드로이드']],os,v=>{os=v;phone()},'휴대폰'));
    if(!window.claude)kids.push(el('h3',{textContent:'누르면 D-day와 시계가 나오는 아이콘'}),
      ...(install?[el('div',{},el('button',{type:'button',className:'main',textContent:'홈 화면에 추가',onclick:()=>{install.prompt();install=null}}))]:[]),
      el('ol',{},...(ios?[li('사파리 아래쪽 공유 버튼(네모에 위 화살표) → 홈 화면에 추가')]:install?[]:[li('크롬 오른쪽 위 ⋮ → 홈 화면에 추가')]),li('생긴 아이콘을 열어 꾸미고 ‘완성! 크게 보기’')));
    kids.push(show);
  }
  kids.push(el('h3',{textContent:'늘 보이는 배경화면'}),el('p',{className:'hint',textContent:'지금 보이는 그림 그대로 저장돼요. 시계는 휴대폰 시계가 나와요.'}),el('div',{},el('button',{type:'button',className:'main',textContent:'배경화면 저장',onclick:save})));
  if(outShown)kids.push(el('p',{},el('strong',{textContent:'저장 창이 안 뜨면 그림을 길게 눌러 사진에 저장하세요.'})),el('button',{type:'button',className:'zoom','aria-label':'그림 크게 보기',onclick:()=>{$('#full').hidden=false;$('#full img').src=outShown}},el('img',{className:'out',src:outShown,alt:'저장할 그림'})),el('p',{},'그래도 안 되면 그림을 한 번 눌러 크게 띄우고 화면을 캡처하세요.'));
  kids.push(el('p',{},ios?'사진 앱에서 그림을 열고 공유 → 배경화면으로 지정':'갤러리에서 그림을 열고 ⋮ → 배경화면으로 설정'));
  $('#phone').replaceChildren(...kids);
}

/* ---------- 시작 ---------- */
(async()=>{
  await Promise.all(Object.entries(ASSET).map(async([k,u])=>IMG[k]=await fresh(u)));
  tabs();panel();phone();render();
  Promise.all([document.fonts.load('60px Jua','D-0:'),document.fonts.load('600 50px "IBM Plex Sans KR"','아기')]).finally(render);
  const read=k=>{try{return JSON.parse(localStorage.getItem(k))}catch{return null}},saved=read('design');
  for(const[k,v]of Object.entries(saved?.pick||{})){const m=v==='mine'&&slot(k)&&read('img-'+k);if(m)try{mineImg[k]=await fresh(m.url);mine[k]=m.url}catch{}}
  if(saved)S={...S,...saved};
  note('꾸민 내용은 이 휴대폰에만 저장돼요');
  $('#cols').inert=false;tabs();panel();phone();render();
  if(alone&&S.done)view();
  setInterval(()=>!drag&&tick(),5000);
})();
</script>
