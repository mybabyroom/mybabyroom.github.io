<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="description" content="아기를 기다리는 방을 꾸며 휴대폰 배경화면으로 저장하세요"><meta property="og:title" content="아기 기다리는 방"><meta property="og:description" content="옷, 트리, 소품을 바꿔 꾸미고 휴대폰 배경화면으로 저장하세요"><meta property="og:type" content="website"><meta property="og:url" content="https://tjehdgyxps-spec.github.io/baby-room/"><meta property="og:image" content="https://tjehdgyxps-spec.github.io/baby-room/og.jpg"><meta property="og:image:width" content="1200"><meta property="og:image:height" content="630"><meta name="twitter:card" content="summary_large_image"><meta name="apple-mobile-web-app-title" content="아기 방"><meta name="theme-color" content="#fbe9ee"><link rel="apple-touch-icon" href="icon-180.png"><link rel="icon" href="icon-192.png"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style><title>아기 기다리는 방</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;600&family=Jua&display=swap">
<style>
/* 레이아웃: 휴대폰은 그림을 위에 고정하고 아래에서 고르기, 넓은 화면은 그림 왼쪽 / 고르기 오른쪽 */
:root{--bg:#fbe9ee;--panel:#fffdfd;--ink:#3a2824;--soft:#8a6f69;--line:#e6c9cf;--accent:#c93445;--on-accent:#fff;--tint:#fdf1f3;
--display:"Jua","IBM Plex Sans KR",sans-serif;--body:"IBM Plex Sans KR","Malgun Gothic","Apple SD Gothic Neo",sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2a2026;--panel:#352930;--ink:#fbeaec;--soft:#c3a9ae;--line:#5a4650;--accent:#f0808c;--on-accent:#2a1418;--tint:#42333b;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#2a2026;--panel:#352930;--ink:#fbeaec;--soft:#c3a9ae;--line:#5a4650;--accent:#f0808c;--on-accent:#2a1418;--tint:#42333b;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:400 15px/1.55 var(--body)}
.app{max-width:1080px;margin:0 auto;padding-block:14px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:14px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font:400 26px/1.2 var(--display);margin:0}
h2{font:400 20px/1.3 var(--display);margin:0}h3{font:400 17px/1.3 var(--display);margin:0}
#status{color:var(--soft);font-size:13px}
.stage{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:4px 8px;min-width:0}
canvas#c{display:block;width:100%;max-width:min(100%,40vh);margin:0 auto;border:2px solid var(--ink);border-radius:4px;touch-action:none;cursor:grab}
.side{display:grid;gap:14px;min-width:0;align-content:start}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 8px;scrollbar-width:thin}
button{font:inherit;color:inherit;cursor:pointer}
.tabs button,.seg button{flex:none;border:2px solid var(--line);background:var(--panel);border-radius:4px;padding:7px 12px;min-height:40px}
.tabs button[aria-selected=true],.seg button[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
.panel{background:var(--panel);border:2px solid var(--ink);border-radius:4px;padding:14px;display:grid;gap:14px;min-width:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:8px}
.grid button{border:2px solid var(--line);background:var(--tint);border-radius:4px;padding:6px 4px;display:grid;justify-items:center;align-content:end;gap:4px;font-size:12px;line-height:1.3;min-height:88px;min-width:0;word-break:keep-all}
.grid button[aria-pressed=true]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.grid img{width:48px;height:48px;object-fit:contain;image-rendering:pixelated}
.grid img.face{image-rendering:auto;width:60px;height:60px;border-radius:6px}.sw{width:40px;height:40px;border-radius:50%;border:2px solid var(--ink)}
.plus{font:400 32px/48px var(--display);color:var(--accent);height:48px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
label{display:grid;gap:4px;font-size:13px;color:var(--soft);flex:1 1 150px;min-width:0}
input[type=text],input[type=date]{font:inherit;font-size:16px;color:var(--ink);background:var(--tint);border:2px solid var(--line);border-radius:4px;padding:8px 10px;width:100%;min-width:0;max-width:100%;min-height:44px}
input[type=date]{-webkit-appearance:none;appearance:none;display:block;text-align:left}input::-webkit-date-and-time-value{text-align:left}
input[type=color]{width:100%;height:44px;padding:4px;border:2px solid var(--line);border-radius:4px;background:var(--tint)}
input[type=range]{width:100%;accent-color:var(--accent)}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.main{border:2px solid var(--accent);background:var(--accent);color:var(--on-accent);border-radius:4px;padding:9px 16px;font-weight:600;min-height:44px}
.plain{border:2px solid var(--line);background:none;border-radius:4px;padding:7px 12px;min-height:40px}
p{margin:0}.hint{color:var(--soft);font-size:13px}
ol{margin:0;padding-left:1.4em;display:grid;gap:8px}
pre{margin:0;background:var(--tint);border:2px solid var(--line);border-radius:4px;padding:10px;overflow:auto;max-height:180px;font-size:12px;white-space:pre;user-select:all}
.pics{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-end}.pic{border:0;background:none;padding:0;display:grid;gap:8px;justify-items:center}.pic canvas{border:2px solid var(--line);border-radius:8px;display:block}#full{position:fixed;inset:0;z-index:20;background:var(--bg);display:grid;align-content:center;justify-items:center;gap:12px;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}#full img{max-width:100%;max-height:76vh;-webkit-touch-callout:default}a.main{display:inline-block;text-decoration:none}.out{max-width:min(100%,300px);-webkit-touch-callout:default;border:2px solid var(--line);border-radius:4px;display:block}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
@media (min-width:860px){.cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;align-items:start}canvas#c{max-width:min(100%,80vh)}.stage{top:calc(env(safe-area-inset-top,0px) + 8px)}}
</style></head><body>

const edge=c=>{const[a,b,d]=[1,3,5].map(i=>parseInt(c.substr(i,2),16));return a*.3+b*.59+d*.11>165?'#3a2824':'#fff'};
function put(g,t,x,y,z){g.textAlign='center';g.textBaseline='middle';g.lineJoin='round';g.font=`400 ${z}px "Jua","IBM Plex Sans KR","Malgun Gothic",sans-serif`;g.strokeStyle=edge(ink());g.lineWidth=z/5;g.strokeText(t,x,y);g.fillStyle=ink();g.fillText(t,x,y)}
let queued=0;const render=()=>{if(!queued)queued=requestAnimationFrame(()=>{queued=0;draw($('#c'),SQUARE);const b=[...boxes].reverse().find(b=>b.id===sel);if(b&&!['tree','info','bubble'].includes(sel)){const g=$('#c').getContext('2d');g.setLineDash([10,8]);g.lineWidth=3;g.strokeStyle='#c93445';g.strokeRect(b.x-5,b.y-5,b.w+10,b.h+10);g.setLineDash([])}})};

/* ---------- 저장 ---------- */
let timer=0;
const note=t=>$('#status').textContent=t;
function store(k,data){try{localStorage.setItem(k,JSON.stringify(data));note('이 휴대폰에 저장했어요')}catch{note('저장 공간이 부족해서 저장하지 못했어요')}}
function changed(){render();phone();clearTimeout(timer);timer=setTimeout(()=>store('design',S),700)}

/* ---------- 내 사진 ---------- */
function cutBg(c){ // 가장자리와 이어진 비슷한 색을 지운다
  const x=c.getContext('2d'),w=c.width,h=c.height,d=x.getImageData(0,0,w,h),p=d.data,seen=new Uint8Array(w*h),st=[];
  const cs=[0,w-1,(h-1)*w,w*h-1].map(i=>[p[i*4],p[i*4+1],p[i*4+2]]);
  const near=i=>p[i*4+3]<20||cs.some(q=>Math.abs(p[i*4]-q[0])+Math.abs(p[i*4+1]-q[1])+Math.abs(p[i*4+2]-q[2])<75);
  const add=i=>{if(!seen[i]&&near(i)){seen[i]=1;st.push(i)}};
  for(let i=0;i<w;i++){add(i);add((h-1)*w+i)}for(let j=0;j<h;j++){add(j*w);add(j*w+w-1)}
  while(st.length){const i=st.pop(),q=i%w;p[i*4+3]=0;if(q)add(i-1);if(q<w-1)add(i+1);if(i>=w)add(i-w);if(i<w*(h-1))add(i+w)}
  x.putImageData(d,0,0);
}
function trim(c){const x=c.getContext('2d'),{width:w,height:h}=c,p=x.getImageData(0,0,w,h).data;let a=w,b=h,e=-1,f=-1;for(let j=0;j<h;j++)for(let i=0;i<w;i++)if(p[(j*w+i)*4+3]>20){a=Math.min(a,i);e=Math.max(e,i);b=Math.min(b,j);f=Math.max(f,j)}if(e<0)return null;const o=cv(e-a+1,f-b+1);o.getContext('2d').drawImage(c,-a,-b);return o}
async function useMine(id){
  const im=src[id],mode=cut[id],plain=['bg','shirt','pants','shoes'].includes(id);let size=id==='bg'?1200:420,url;
  for(;;size*=.8){
    const k=Math.min(1,size/Math.max(im.width,im.height));let c=cv(im.width*k,im.height*k),x=c.getContext('2d');x.drawImage(im,0,0,c.width,c.height);
    if(!plain&&mode==='round'){const z=Math.min(c.width,c.height),o=cv(z,z),y=o.getContext('2d');y.beginPath();y.arc(z/2,z/2,z/2-1,0,7);y.clip();y.drawImage(c,(z-c.width)/2,(z-c.height)/2);y.lineWidth=z/22;y.strokeStyle=INK;y.stroke();c=o}
    if(!plain&&mode==='cut'){cutBg(c);c=trim(c);if(!c){note('배경과 그림 색이 비슷해서 다 지워졌어요. 그대로 넣었어요');cut[id]='whole';return useMine(id)}}
    url=plain?c.toDataURL('image/jpeg',.82):c.toDataURL('image/webp',.88);
    if(url.length<220000)break; // 브라우저 저장 공간(약 5MB) 안에 자리마다 한 장씩 들어가게
  }
  mine[id]=url;mineImg[id]=await fresh(url);S.pick[id]='mine';store('img-'+id,{url});changed();panel();
}
$('#file').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;const id=sel,u=URL.createObjectURL(f);try{src[id]=await fresh(u);cut[id]=cut[id]||'cut';await useMine(id)}catch{note('이 사진은 열 수 없어요. JPG나 PNG로 넣어 주세요')}};

/* ---------- 고르기 화면 ---------- */
function seg(items,cur,fn,label){return el('div',{className:'seg',role:'group','aria-label':label},...items.map(([v,t])=>el('button',{type:'button',textContent:t,'aria-pressed':String(v===cur),onclick:()=>fn(v)})))}
function tabs(){const t=$('#tabs');t.replaceChildren(...SLOTS.map(s=>el('button',{type:'button',role:'tab',textContent:s.label,'aria-selected':String(s.id===sel),onclick:()=>choose(s.id)})));const b=t.querySelector('[aria-selected=true]');t.scrollLeft=b.offsetLeft-t.offsetLeft-60}
function choose(id){sel=id;tabs();panel();render()}
function field(label,input){return el('label',{},label,input)}
function panel(){
  const s=slot(sel),P=$('#panel'),kids=[el('h2',{textContent:s.label})];
  if(sel==='info'){
    kids.push(field('아기 만나는 날',el('input',{id:'due',type:'date',value:S.due,onchange:e=>{S.due=e.target.value;changed()}})),el('p',{className:'hint',textContent:'날짜를 비우면 글자가 안 나와요.'}));
    const setInk=c=>{S.ink=c;changed();panel()},INKS=[['','자동'],['#c93445','빨강'],['#ee7f9a','분홍'],['#ffffff','하양'],['#3a2824','갈색'],['#f2b63c','노랑'],['#4f7d4a','초록'],['#3f6fae','파랑'],['#7d62b3','보라']];
    kids.push(el('h3',{textContent:'글자색'}),el('div',{className:'grid'},...INKS.map(([c,t])=>{const w=el('span',{className:'sw'});w.style.background=c||'linear-gradient(135deg,#c93445 50%,#fff3d6 50%)';return el('button',{type:'button','aria-pressed':String((S.ink||'')===c),onclick:()=>setInk(c)},w,el('span',{textContent:t}))})),
      field('원하는 색 직접 고르기',el('input',{id:'ink',type:'color',value:ink(),oninput:e=>{S.ink=e.target.value;changed()}})));
  }else if(sel==='bubble'){
    for(const[k,l]of[['b1','엄마 말풍선'],['b2','인형 말풍선']])kids.push(field(l,el('input',{id:k,type:'text',maxLength:k==='b1'?14:7,value:S[k],oninput:e=>{S[k]=e.target.value;changed()}})));
    kids.push(el('p',{className:'hint',textContent:(PUB?'태명으로 바꿔 보세요. ':'')+'비워 두면 말풍선이 사라져요.'}));
  }else{
    const cur=S.pick[sel]==='mine'&&mine[sel]?'mine':opt(sel).id,head=o=>{const keep=S.pick[sel],c=cv(150,150);S.pick[sel]=o.id;draw(c,['style','bang'].includes(sel)?{x:556,y:440,w:290,h:290}:{x:602,y:528,w:130,h:130});S.pick[sel]=keep;return el('img',{className:'face',src:c.toDataURL(),alt:''})},pic=o=>['style','bang','eyes','nose','mouth'].includes(sel)&&IMG.mom?head(o):o.kind==='sprite'||(o.kind==='orig'&&o.img&&ASSET[o.img])?el('img',{src:ASSET[o.img],alt:''}):o.kind==='pat'?(()=>{const c=cv(44,44);pattern(c.getContext('2d'),44,44,o.id);return el('img',{src:c.toDataURL(),alt:''})})():o.color?(()=>{const e=el('span',{className:'sw'});e.style.background=o.color;return e})():el('span',{className:'plus',textContent:o.kind==='none'?'×':'↺'});
    const g=el('div',{className:'grid'},...s.opts.map(o=>el('button',{type:'button','aria-pressed':String(cur===o.id),onclick:()=>{S.pick[sel]=o.id;delete S.adj[sel];changed();panel()}},pic(o),el('span',{textContent:o.label}))));
    if(s.mine){
      if(mine[sel])g.append(el('button',{type:'button','aria-pressed':String(cur==='mine'),onclick:()=>{S.pick[sel]='mine';changed();panel()}},el('img',{src:mine[sel],alt:''}),el('span',{textContent:'내 그림'})));
      g.append(el('button',{type:'button',onclick:()=>$('#file').click()},el('span',{className:'plus',textContent:'+'}),el('span',{textContent:mine[sel]?'다른 사진':'내 사진 넣기'})));
    }
    kids.push(g);
    if(cur==='mine'&&src[sel]&&(s.a||s.spots))kids.push(seg([['cut','배경 지우기'],['round','동그랗게'],['whole','그대로']],cut[sel],v=>{cut[sel]=v;useMine(sel)},'내 사진 모양'));
    if((s.a||s.spots)&&!(s.spots&&cur==='orig')&&!(s.id==='print'&&cur==='orig')&&cur!=='none'){
      const a=adj(sel),set=(k,v)=>{S.adj[sel]={...adj(sel),[k]:v};changed()};
      kids.push(el('div',{className:'row'},field('크기',el('input',{id:'size',type:'range',min:.3,max:2.5,step:.05,value:a.s,oninput:e=>set('s',+e.target.value)})),...(s.a?[field('기울기',el('input',{id:'rot',type:'range',min:-180,max:180,step:5,value:a.r,oninput:e=>set('r',+e.target.value)}))]:[]),el('button',{type:'button',className:'plain',textContent:'제자리로',onclick:()=>{delete S.adj[sel];changed();panel()}})));
      kids.push(el('p',{className:'hint',textContent:'그림에서 끌면 위치를 옮길 수 있어요.'}));
    }
  }
  P.replaceChildren(...kids);render();
}
/* 그림을 눌러 고르고 끌어 옮기기 */
let drag=null;const C=$('#c');
const pt=e=>{const r=C.getBoundingClientRect();return[SQUARE.x+(e.clientX-r.left)/r.width*SQUARE.w,SQUARE.y+(e.clientY-r.top)/r.height*SQUARE.h]};
C.onpointerdown=e=>{const[x,y]=pt(e),hit=[...boxes].reverse().filter(b=>x>=b.x&&x<=b.x+b.w&&y>=b.y&&y<=b.y+b.h);if(!hit.length)return;const h=hit.find(b=>b.id===sel)||hit[0];if(h.id!==sel)choose(h.id);const s=slot(sel);if((s.a||s.spots)&&!(['orn','print'].includes(sel)&&opt(sel).kind==='orig')){drag=[x,y,adj(sel)];C.setPointerCapture(e.pointerId)}};
C.onpointermove=e=>{if(!drag)return;const[x,y]=pt(e);S.adj[sel]={...drag[2],x:drag[2].x+x-drag[0],y:drag[2].y+y-drag[1]};render()};
C.onpointerup=C.onpointercancel=()=>{if(drag){drag=null;changed()}};

/* ---------- 사진 저장 ---------- */
let outShown=null;
async function save(win,name){
  const c=cv(1290,1290*win.h/win.w);draw(c,win);render();outShown=c.toDataURL('image/png');
  const blob=new Blob([Uint8Array.from(atob(outShown.split(',')[1]),x=>x.charCodeAt(0))],{type:'image/png'});
  if(window.claude)try{const d=await claude.use('downloads');if(d){await d.save({filename:name,data:blob});return}}catch{}
  else{ // 휴대폰에서는 공유 창(이미지 저장)을 먼저 쓴다
    const file=new File([blob],name,{type:'image/png'});
    if(matchMedia('(pointer:coarse)').matches&&navigator.canShare?.({files:[file]}))try{await navigator.share({files:[file]});return}catch(e){if(e.name==='AbortError')return}
    if(!matchMedia('(pointer:coarse)').matches){el('a',{href:outShown,download:name}).click();return}
  }
  $('#full').hidden=false;$('#full img').src=outShown; // 공유 창이 없으면 크게 띄워 길게 누르게 한다
}
function phone(){
  const one=(win,w,label,name)=>{const c=cv(w*2,w*2*win.h/win.w);if(IMG.mom)draw(c,win);c.style.width=w+'px';c.setAttribute('aria-hidden','true');return el('button',{type:'button',className:'pic',onclick:()=>save(win,name)},c,el('span',{className:'main',textContent:label}))};
  const kids=[el('h2',{textContent:'사진 저장'}),el('p',{textContent:'그림 위치를 고르고 저장해 배경화면으로 지정하세요. 비워 둔 자리에 휴대폰의 시계나 D-day 위젯을 올리면 나만의 화면으로 예쁘게 쓸 수 있어요.'}),el('p',{className:'hint',textContent:'시간과 D-day는 휴대폰 위젯이 매일 알아서 바꿔 줘요. 잠금화면을 길게 눌러 시계 글꼴과 색을 그림에 맞추면 더 예뻐요.'}),seg([['up','그림 위'],['mid','가운데'],['down','아래']],S.pos||'mid',v=>{S.pos=v;changed()},'배경화면 그림 위치')];
  if(/KAKAOTALK/i.test(navigator.userAgent)&&!window.claude)kids.push(el('div',{},el('a',{className:'main',href:'kakaotalk://web/openExternal?url='+encodeURIComponent(location.href),textContent:'먼저 사파리·크롬으로 열기'})));
  kids.push(el('div',{className:'pics'},one(TALL,130,'배경화면 저장','baby-wallpaper.png'),one(SQUARE,130,'정사각형 저장','baby-square.png')));
  $('#phone').replaceChildren(...kids);
}

/* ---------- 시작 ---------- */
(async()=>{
  await Promise.all(Object.entries(ASSET).map(async([k,u])=>IMG[k]=await fresh(u)));
  tabs();panel();phone();render();
  Promise.all([document.fonts.load('60px Jua','D-0:'),document.fonts.load('600 50px "IBM Plex Sans KR"','아기')]).finally(()=>{render();phone()});
  const read=k=>{try{return JSON.parse(localStorage.getItem(k))}catch{return null}},saved=read('design');
  for(const[k,v]of Object.entries(saved?.pick||{})){const m=v==='mine'&&slot(k)&&read('img-'+k);if(m)try{mineImg[k]=await fresh(m.url);mine[k]=m.url}catch{}}
  if(saved)S={...S,...saved,pick:{...S.pick,...saved.pick}};
  note('꾸민 내용은 이 휴대폰에만 저장돼요');
  $('#cols').inert=false;tabs();panel();phone();render();
})();
</script>
